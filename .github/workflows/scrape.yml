name: Auto Scrape CNN Indonesia M3U8

on:
  schedule:
    # Chạy tự động mỗi 2 tiếng một lần (Cron format: phút giờ ngày tháng thứ)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" để chạy thủ công bất cứ lúc nào

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền cho bot tự commit code lên repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit & Push Updated Links
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cnn_link.txt cnn.m3u8
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update CNN Indonesia M3U8 token [skip ci]" && git push)
